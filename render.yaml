services:
  - type: web
    name: coldchain-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /api/health
    plan: starter
    disk:
      name: coldchain-evidence-disk
      mountPath: /var/data/storage
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: coldchain-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_PATH
        value: /var/data/storage
      - key: CORS_ORIGINS
        value: https://coldchain-sentinel.vercel.app,http://localhost:3000
      - key: PAYPAL_MODE
        value: SANDBOX
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com

databases:
  - name: coldchain-db
    plan: starter
    databaseName: coldchain_db
    user: coldchain_user
    postgresMajorVersion: "16"
