[pytest]
testpaths = backend/tests tests
pythonpath = backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -v --tb=short
markers =
    unit: Fast unit tests
    integration: Integration tests with database or external mocks
    payment: Payment state transition and idempotency tests
